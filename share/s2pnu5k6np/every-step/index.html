  const SAVED = 'xsl-shared-key-' + LOCKED.salt.slice(0, 8);
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (u8) => btoa(String.fromCharCode(...new Uint8Array(u8)));
  const form = document.getElementById('unlock');
  const pw = document.getElementById('pw');
  const msg = document.getElementById('msg');
  const button = form.querySelector('button');
  const hasCrypto = !!(window.crypto && window.crypto.subtle);

  async function openWith(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.ct));
    const html = new TextDecoder().decode(plain);
    // While this page is still being parsed, document.open() is ignored and the write would land inside it.
    if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
    document.open();
    document.write(html);
    document.close();
  }

  function showForm() {
    document.body.classList.remove('checking');
    if (!hasCrypto) {
      button.disabled = true;
      msg.textContent = "This browser can't open private pages. Please try Safari or Chrome.";
      return;
    }
    pw.focus();
  }

  (async () => {
    let saved = null;
    try { saved = sessionStorage.getItem(SAVED); } catch (e) { /* storage blocked: ask for the password */ }
    if (saved && hasCrypto) {
      try {
        const key = await crypto.subtle.importKey('raw', bytes(saved), { name: 'AES-GCM' }, false, ['decrypt']);
        await openWith(key);
        return;
      } catch (e) {
        try { sessionStorage.removeItem(SAVED); } catch (e2) { /* nothing to clear */ }
      }
    }
    showForm();
  })();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    // Letter case and stray spaces don't matter, so a phone's automatic capital doesn't lock anyone out.
    const pass = pw.value.trim().toLowerCase();
    if (!pass) return;
    button.disabled = true;
    button.textContent = 'Opening…';
    msg.textContent = '';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(LOCKED.salt), iterations: LOCKED.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.ct));

      button.disabled = false;
      button.textContent = 'Open';
      msg.textContent = "That password didn't work. Check it and try again.";
      pw.select();
    }
  });
